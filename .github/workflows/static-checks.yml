name: JavaScript checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check application JavaScript syntax
        run: |\n          node --check script.js\n          node --check finance-utils.js\n      - name: Run utility behavior tests\n        run: node --test tests/*.test.js
