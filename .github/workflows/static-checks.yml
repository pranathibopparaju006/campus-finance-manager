name: JavaScript and project checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check application JavaScript syntax
        run: node --check script.js

      - name: Validate required files and local references
        run: |
          python - <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path(".")
          required = ["index.html", "style.css", "script.js", "README.md"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Missing required project files: {', '.join(missing)}")

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.assets.append(attrs["src"])
                  if tag == "link" and "stylesheet" in attrs.get("rel", "").split() and attrs.get("href"):
                      self.assets.append(attrs["href"])

          parser = AssetParser()
          parser.feed((root / "index.html").read_text(encoding="utf-8"))
          missing_assets = []
          for asset in parser.assets:
              parsed = urlparse(asset)
              if parsed.scheme or asset.startswith("//") or asset.startswith("#"):
                  continue
              if not (root / parsed.path).is_file():
                  missing_assets.append(asset)
          if missing_assets:
              raise SystemExit(f"Missing local assets referenced by index.html: {', '.join(missing_assets)}")

          readme = (root / "README.md").read_text(encoding="utf-8")
          image_paths = re.findall(r"!\[[^\]]*\]\(([^)]+)\)", readme)
          missing_images = []
          for image_path in image_paths:
              parsed = urlparse(image_path)
              if parsed.scheme or image_path.startswith("//"):
                  continue
              if not (root / parsed.path).is_file():
                  missing_images.append(image_path)
          if missing_images:
              raise SystemExit(f"Missing local images referenced by README.md: {', '.join(missing_images)}")

          print("Required files, local HTML assets, and README images validated.")
          PY
